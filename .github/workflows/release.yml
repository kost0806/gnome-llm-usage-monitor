name: Release

# Push a tag like v1.0.0 to build the extension zip and publish a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Build extension zip
        run: ./scripts/pack.sh "${GITHUB_REF_NAME#v}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Install/update instructions first; GitHub's generated changelog is appended after them.
        run: |
          sed -e "s#{{TAG}}#$GITHUB_REF_NAME#g" -e "s#{{REPO}}#$GITHUB_REPOSITORY#g" \
            .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/ai-usage@local.shell-extension.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
