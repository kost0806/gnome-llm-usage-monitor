name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests (pure modules)
        run: npm test

      - name: Syntax check (GJS modules)
        run: npm run check

      - name: Validate metadata.json
        run: jq -e '.uuid == "ai-usage@local" and (."shell-version" | length > 0)' ai-usage@local/metadata.json

      - name: Lint shell scripts
        run: shellcheck install.sh scripts/pack.sh

      - name: Build extension zip
        id: pack
        run: |
          zip=$(./scripts/pack.sh "dev-${GITHUB_SHA::7}")
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$zip" .zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pack.outputs.name }}
          path: ${{ steps.pack.outputs.zip }}
          if-no-files-found: error
